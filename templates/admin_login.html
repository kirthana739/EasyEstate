<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyEstate — Admin Access</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#d4af37;--gold2:#ffd700;
  --gold-dim:rgba(212,175,55,0.1);
  --bg:#070707;--surface:#0f0f0f;--surface2:#141414;
  --border:rgba(212,175,55,0.18);--text:#f0f0f0;--muted:#555;
  --red:#ff4444;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;}

body{
  background:var(--bg);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}

/* BG */
.bg-layer{
  position:fixed;inset:0;
  background:url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=1400&q=90') center/cover;
  opacity:0.07;
}
.bg-grad{
  position:fixed;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(212,175,55,0.06),transparent 60%),
             linear-gradient(180deg,rgba(7,7,7,0.98),rgba(7,7,7,0.95));
}

/* FRAME */
.frame-line{position:fixed;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,0.2),transparent);}
.frame-line.top{top:24px;}.frame-line.bottom{bottom:24px;}
.corner{position:fixed;width:16px;height:16px;}
.c-tl{top:18px;left:18px;border-top:1px solid rgba(212,175,55,0.35);border-left:1px solid rgba(212,175,55,0.35);}
.c-tr{top:18px;right:18px;border-top:1px solid rgba(212,175,55,0.35);border-right:1px solid rgba(212,175,55,0.35);}
.c-bl{bottom:18px;left:18px;border-bottom:1px solid rgba(212,175,55,0.35);border-left:1px solid rgba(212,175,55,0.35);}
.c-br{bottom:18px;right:18px;border-bottom:1px solid rgba(212,175,55,0.35);border-right:1px solid rgba(212,175,55,0.35);}

/* CARD */
.card{
  position:relative;z-index:10;
  width:420px;max-width:94vw;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:24px;
  padding:48px 44px;
  text-align:center;
  box-shadow:0 40px 80px rgba(0,0,0,0.7),0 0 0 1px rgba(212,175,55,0.06);
  animation:rise 0.9s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(0.96);}to{opacity:1;transform:translateY(0) scale(1);}}

/* Gold top shimmer */
.card::before{
  content:'';position:absolute;top:0;left:15%;right:15%;
  height:1px;border-radius:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

/* LOCK ICON */
.lock-wrap{
  width:80px;height:80px;border-radius:50%;
  background:rgba(212,175,55,0.08);
  border:2px solid rgba(212,175,55,0.2);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 28px;
  font-size:34px;
  animation:iconPop 0.8s cubic-bezier(0.16,1,0.3,1) 0.3s both;
  position:relative;
}
@keyframes iconPop{from{opacity:0;transform:scale(0.4);}to{opacity:1;transform:scale(1);}}

/* Pulse ring */
.lock-wrap::after{
  content:'';position:absolute;inset:-8px;border-radius:50%;
  border:1px solid rgba(212,175,55,0.1);
  animation:pulseRing 2.5s ease infinite;
}
@keyframes pulseRing{0%{transform:scale(1);opacity:0.6;}100%{transform:scale(1.3);opacity:0;}}

/* TYPOGRAPHY */
.eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;animation:fadeUp 0.6s ease 0.4s both;}
.title{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:700;color:var(--text);margin-bottom:6px;animation:fadeUp 0.7s ease 0.5s both;}
.sub{font-size:13px;color:var(--muted);font-weight:300;margin-bottom:30px;animation:fadeUp 0.6s ease 0.6s both;}

/* FIELDS */
.field{margin-bottom:16px;text-align:left;animation:fadeUp 0.6s ease both;}
.field:nth-child(1){animation-delay:0.55s;}
.field:nth-child(2){animation-delay:0.6s;}
.field label{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
.field input{
  width:100%;padding:13px 16px;
  background:var(--surface2);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:10px;color:var(--text);
  font-size:14px;font-family:'DM Sans',sans-serif;
  outline:none;
  transition:border-color 0.25s,box-shadow 0.25s;
}
.field input::placeholder{color:#252525;}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,0.08);}

/* ERROR */
.error-msg{
  background:rgba(255,68,68,0.08);
  border:1px solid rgba(255,68,68,0.22);
  color:#ff6b6b;border-radius:9px;
  padding:10px 14px;font-size:13px;
  margin-bottom:16px;display:none;
  animation:shake 0.4s ease;
}
.error-msg.show{display:block;}
@keyframes shake{
  0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}
  40%{transform:translateX(7px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}
}

/* ATTEMPTS WARNING */
.attempts-msg{
  font-size:12px;color:#ff8844;
  margin-bottom:14px;display:none;text-align:center;
}
.attempts-msg.show{display:block;}

/* LOGIN BTN */
.login-btn{
  width:100%;padding:14px;
  background:linear-gradient(135deg,#b8860b,var(--gold2));
  color:#000;border:none;border-radius:10px;
  font-size:14px;font-weight:700;letter-spacing:0.5px;
  cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:opacity 0.2s,transform 0.2s;
  position:relative;overflow:hidden;
  animation:fadeUp 0.6s ease 0.65s both;
  margin-top:4px;
}
.login-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,255,255,0.15));opacity:0;transition:opacity 0.2s;}
.login-btn:hover:not(:disabled){opacity:0.9;transform:scale(1.01);}
.login-btn:hover:not(:disabled)::after{opacity:1;}
.login-btn:disabled{opacity:0.45;cursor:not-allowed;}

/* SPINNER */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,0.25);border-top-color:#000;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:7px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* LOCKED STATE */
.locked-overlay{
  position:absolute;inset:0;border-radius:24px;
  background:rgba(7,7,7,0.92);
  display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;
  z-index:20;border-radius:24px;
}
.locked-overlay.show{display:flex;}
.lock-icon-big{font-size:48px;}
.lock-timer{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:700;color:var(--red);}
.lock-msg{font-size:13px;color:#888;text-align:center;max-width:260px;line-height:1.6;}

/* BACK LINK */
.back-link{display:block;margin-top:18px;font-size:12px;color:var(--muted);text-decoration:none;transition:color 0.2s;animation:fadeUp 0.6s ease 0.7s both;}
.back-link:hover{color:var(--gold);}

/* ANIM */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<div class="bg-layer"></div>
<div class="bg-grad"></div>
<div class="frame-line top"></div>
<div class="frame-line bottom"></div>
<div class="corner c-tl"></div>
<div class="corner c-tr"></div>
<div class="corner c-bl"></div>
<div class="corner c-br"></div>

<div class="card" id="mainCard">

  <!-- LOCKED OVERLAY -->
  <div class="locked-overlay" id="lockedOverlay">
    <div class="lock-icon-big">🔒</div>
    <div class="lock-timer" id="lockTimer">30</div>
    <div class="lock-msg">Too many failed attempts.<br>Please wait before trying again.</div>
  </div>

  <div class="lock-wrap">🔐</div>

  <div class="eyebrow">Restricted Access</div>
  <div class="title">Admin Panel</div>
  <p class="sub">Enter your admin credentials to continue</p>

  <div class="error-msg"   id="errMsg"></div>
  <div class="attempts-msg" id="attemptsMsg"></div>

  <div class="field">
    <label>Admin Username</label>
    <input type="text" id="username" placeholder="admin" autocomplete="username">
  </div>

  <div class="field">
    <label>Admin Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="login-btn" id="loginBtn" onclick="adminLogin()">
    Enter Admin Panel →
  </button>

  <a href="/index" class="back-link">← Back to Website</a>

</div>

<script>
let attempts  = 0;
const MAX_ATT = 3;
let lockTimer = null;

async function adminLogin(){
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const errMsg   = document.getElementById("errMsg");
  const attMsg   = document.getElementById("attemptsMsg");
  const btn      = document.getElementById("loginBtn");

  errMsg.classList.remove("show");
  attMsg.classList.remove("show");

  if(!username || !password){
    errMsg.textContent = "⚠️ Please fill in both fields.";
    errMsg.classList.add("show"); return;
  }

  btn.disabled  = true;
  btn.innerHTML = '<span class="spinner"></span>Verifying…';

  try{
    const res    = await fetch("/admin/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username, password})
    });
    const result = await res.json();

    if(res.ok && result.success){
      btn.innerHTML = "✓ Access Granted";
      setTimeout(()=>{ window.location.href="/admin/messages"; }, 600);

    } else {
      attempts++;
      const remaining = MAX_ATT - attempts;

      errMsg.textContent = "❌ " + (result.error || "Invalid credentials.");
      errMsg.classList.add("show");

      if(remaining > 0){
        attMsg.textContent = `⚠️ ${remaining} attempt${remaining>1?'s':''} remaining before lockout`;
        attMsg.classList.add("show");
      }

      btn.disabled  = false;
      btn.innerHTML = "Enter Admin Panel →";

      // Lock after MAX_ATT failures
      if(attempts >= MAX_ATT){
        startLockout();
      }
    }
  } catch(e){
    errMsg.textContent = "⚠️ Cannot reach server. Make sure Flask is running.";
    errMsg.classList.add("show");
    btn.disabled  = false;
    btn.innerHTML = "Enter Admin Panel →";
  }
}

function startLockout(){
  const overlay = document.getElementById("lockedOverlay");
  const timerEl = document.getElementById("lockTimer");
  overlay.classList.add("show");
  let secs = 30;
  timerEl.textContent = secs;

  lockTimer = setInterval(()=>{
    secs--;
    timerEl.textContent = secs;
    if(secs <= 0){
      clearInterval(lockTimer);
      overlay.classList.remove("show");
      attempts = 0;
      document.getElementById("attemptsMsg").classList.remove("show");
      document.getElementById("loginBtn").disabled = false;
      document.getElementById("loginBtn").innerHTML = "Enter Admin Panel →";
      document.getElementById("password").value = "";
    }
  }, 1000);
}

document.addEventListener("keydown", e=>{
  if(e.key==="Enter") adminLogin();
});
</script>

</body>
</html>
