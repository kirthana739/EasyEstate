<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyEstate | Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;0,700;1,300;1,600&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#000;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-family:'DM Sans',sans-serif;
}

/* BG IMAGE */
.bg-layer{
  position:fixed;inset:0;
  background:url('https://wallpapercave.com/wp/wp4110681.jpg') center/cover no-repeat;
  opacity:0;
  transform:scale(1.08);
  animation:bgReveal 1.4s ease 0.2s forwards;
}
@keyframes bgReveal{
  to{opacity:1;transform:scale(1);}
}

.bg-overlay{
  position:fixed;inset:0;
  background:linear-gradient(135deg,rgba(0,0,0,0.9) 0%,rgba(0,0,0,0.7) 50%,rgba(0,0,0,0.9) 100%);
}

/* GOLD ORBS */
.orb{
  position:fixed;border-radius:50%;
  filter:blur(90px);pointer-events:none;z-index:1;
}
.orb1{
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(212,175,55,0.1),transparent 70%);
  top:-150px;left:-150px;
  animation:drift1 10s ease-in-out infinite alternate;
}
.orb2{
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(255,215,0,0.07),transparent 70%);
  bottom:-100px;right:-100px;
  animation:drift2 12s ease-in-out infinite alternate;
}
@keyframes drift1{from{transform:translate(0,0);}to{transform:translate(70px,50px);}}
@keyframes drift2{from{transform:translate(0,0);}to{transform:translate(-60px,-40px);}}

/* FRAME */
.line-top,.line-bottom{
  position:fixed;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,175,55,0.35),transparent);
  z-index:2;opacity:0;
  animation:fadeIn 0.8s ease 1s forwards;
}
.line-top{top:36px;}
.line-bottom{bottom:36px;}

.corner{
  position:fixed;width:22px;height:22px;
  z-index:2;opacity:0;
  animation:fadeIn 0.6s ease 1.2s forwards;
}
.corner-tl{top:26px;left:26px;border-top:1px solid rgba(212,175,55,0.5);border-left:1px solid rgba(212,175,55,0.5);}
.corner-tr{top:26px;right:26px;border-top:1px solid rgba(212,175,55,0.5);border-right:1px solid rgba(212,175,55,0.5);}
.corner-bl{bottom:26px;left:26px;border-bottom:1px solid rgba(212,175,55,0.5);border-left:1px solid rgba(212,175,55,0.5);}
.corner-br{bottom:26px;right:26px;border-bottom:1px solid rgba(212,175,55,0.5);border-right:1px solid rgba(212,175,55,0.5);}

/* MAIN SPLASH */
.splash{
  position:relative;z-index:10;
  text-align:center;
  display:flex;flex-direction:column;
  align-items:center;
}

/* LOGO */
.logo-wrap{
  position:relative;
  width:160px;height:160px;
  margin-bottom:34px;
}

.ring-spin{
  position:absolute;
  inset:-14px;border-radius:50%;
  border:1px solid transparent;
  border-top-color:rgba(212,175,55,0.7);
  border-right-color:rgba(212,175,55,0.2);
  opacity:0;
  animation:spinRing 3s linear infinite, fadeIn 0.5s ease 0.7s forwards;
}
@keyframes spinRing{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

.ring-slow{
  position:absolute;
  inset:-5px;border-radius:50%;
  border:1px dashed rgba(212,175,55,0.18);
  opacity:0;
  animation:spinRev 10s linear infinite, fadeIn 0.5s ease 0.9s forwards;
}
@keyframes spinRev{from{transform:rotate(0deg);}to{transform:rotate(-360deg);}}

.logo-wrap img{
  width:160px;height:160px;
  border-radius:50%;object-fit:cover;
  border:3px solid #d4af37;
  box-shadow:0 0 35px rgba(212,175,55,0.45),0 0 90px rgba(212,175,55,0.12);
  opacity:0;
  animation:logoReveal 1s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
}
@keyframes logoReveal{
  0%{opacity:0;transform:scale(0.5);}
  60%{opacity:1;transform:scale(1.05);}
  100%{opacity:1;transform:scale(1);}
}

/* TEXT */
.eyebrow{
  font-size:10px;letter-spacing:5px;
  text-transform:uppercase;
  color:rgba(212,175,55,0.65);
  margin-bottom:10px;
  opacity:0;
  animation:textUp 0.7s ease 1s forwards;
}

.brand-name{
  font-family:'Cormorant Garamond',serif;
  font-size:68px;font-weight:600;
  letter-spacing:3px;
  color:#fff;line-height:1;
  opacity:0;
  animation:textUp 0.8s ease 1.1s forwards;
}

.brand-name em{
  font-style:italic;color:#ffd700;
}

.tagline{
  font-size:12px;font-weight:300;
  letter-spacing:4px;
  text-transform:uppercase;
  color:rgba(255,255,255,0.4);
  margin-top:14px;
  opacity:0;
  animation:textUp 0.7s ease 1.3s forwards;
}

.gold-bar{
  width:0;height:1px;
  background:linear-gradient(90deg,transparent,#d4af37,transparent);
  margin:20px auto;
  animation:barGrow 0.9s ease 1.5s forwards;
}
@keyframes barGrow{to{width:100px;}}

.dots{
  display:flex;gap:8px;
  opacity:0;
  animation:fadeIn 0.5s ease 1.7s forwards;
}
.dot{
  width:5px;height:5px;border-radius:50%;
  background:rgba(212,175,55,0.35);
  animation:dotPulse 1.5s ease infinite;
}
.dot:nth-child(2){animation-delay:0.25s;}
.dot:nth-child(3){animation-delay:0.5s;}
@keyframes dotPulse{
  0%,100%{background:rgba(212,175,55,0.3);transform:scale(1);}
  50%{background:#ffd700;transform:scale(1.5);}
}

/* PROGRESS */
.progress-wrap{
  position:fixed;bottom:58px;left:50%;
  transform:translateX(-50%);
  width:180px;z-index:10;
  opacity:0;
  animation:fadeIn 0.5s ease 1.9s forwards;
}
.progress-track{
  width:100%;height:1px;
  background:rgba(255,255,255,0.07);
  overflow:hidden;border-radius:2px;
}
.progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,transparent,#d4af37,#ffd700);
  animation:fillProg 3.4s ease 1.9s forwards;
}
@keyframes fillProg{to{width:100%;}}

.progress-text{
  text-align:center;margin-top:8px;
  font-size:9px;letter-spacing:2.5px;
  color:rgba(255,255,255,0.2);
  text-transform:uppercase;
}

/* EXIT */
.splash.exit,.bg-layer.exit,.orb.exit{
  animation:exitZoom 0.8s ease forwards;
}
@keyframes exitZoom{
  to{opacity:0;transform:scale(1.12);}
}

/* SHARED */
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes textUp{
  from{opacity:0;transform:translateY(18px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>
<body>

<div class="bg-layer"  id="bgLayer"></div>
<div class="bg-overlay"></div>
<div class="orb orb1" id="orb1"></div>
<div class="orb orb2" id="orb2"></div>

<div class="line-top"></div>
<div class="line-bottom"></div>
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<div class="splash" id="splash">

  <div class="logo-wrap">
    <div class="ring-spin"></div>
    <div class="ring-slow"></div>
    <img src="https://i.pinimg.com/originals/7a/40/4f/7a404fd1f550f82ee8c98787dd958502.jpg" alt="EasyEstate">
  </div>

  <div class="eyebrow">Premium Real Estate Platform</div>
  <div class="brand-name">Easy<em>Estate</em></div>
  <div class="tagline">Luxury Living Starts Here</div>
  <div class="gold-bar"></div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

</div>

<div class="progress-wrap">
  <div class="progress-track">
    <div class="progress-fill"></div>
  </div>
  <div class="progress-text">Loading Experience</div>
</div>

<script>
setTimeout(function(){
  document.getElementById("splash").classList.add("exit");
  document.getElementById("bgLayer").classList.add("exit");
  document.getElementById("orb1").classList.add("exit");
  document.getElementById("orb2").classList.add("exit");
  setTimeout(function(){
    window.location.href = "/loginpage";
  }, 800);
}, 4800);
</script>

</body>
</html>
