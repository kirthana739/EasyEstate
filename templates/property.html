<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyEstate</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:black;
  color:white;
  padding:30px;
}

/* ================== PROPERTIES SECTION ================== */

h2{
  margin-bottom:20px;
}

.properties-container{
  display:flex;
  flex-wrap:wrap;
  gap:30px;
  margin-bottom:60px;
}

.property-card{
  background:#f5c400;
  color:black;
  padding:25px;
  border-radius:10px;
  width:300px;
  transition:0.3s;
}

.property-card h3{
  margin-bottom:10px;
}

.property-card p{
  margin-bottom:15px;
  font-weight:bold;
}

.property-card button{
  padding:8px 15px;
  border:none;
  cursor:pointer;
  background:white;
  border-radius:4px;
}

.property-card:hover{
  transform:scale(1.05);
}

/* ================== FORM SECTION ================== */

.form-container{
  max-width:600px;
  margin:auto;
}

form input,
form select{
  width:100%;
  padding:15px;
  margin-bottom:20px;
  border:none;
  outline:none;
  background:#ddd;
}

form button{
  width:100%;
  padding:15px;
  border:none;
  background:linear-gradient(to right,#c89b00,#f5c400);
  font-size:16px;
  cursor:pointer;
}

</style>
</head>
<body>

<!-- ================= PROPERTIES ================= -->

<h2>Properties</h2>

<div class="properties-container" id="properties">

  <!-- Default Property -->
  <div class="property-card">
    <h3>Luxury Villa – Goa</h3>
    <p>₹2 Cr</p>
    <button>View Details</button>
  </div>

  <div class="property-card">
    <h3>Beach House – Kerala</h3>
    <p>₹3.5 Cr</p>
    <button>View Details</button>
  </div>

</div>

<!-- ================= SUBMIT PROPERTY ================= -->

<h2>Submit Property</h2>

<div class="form-container">
<form id="propertyForm">

  <input type="text" id="title" placeholder="Title" required>
  <input type="text" id="location" placeholder="Location" required>
  <input type="text" id="price" placeholder="Price" required>

  <select id="type">
    <option>Sale</option>
    <option>Rent</option>
  </select>

  <select id="category">
    <option>Villa</option>
    <option>Apartment</option>
    <option>Farm House</option>
  </select>

  <select id="bedrooms">
    <option>1</option>
    <option>2</option>
    <option>3</option>
    <option>4</option>
  </select>

  <select id="bathrooms">
    <option>1</option>
    <option>2</option>
    <option>3</option>
  </select>

  <button type="submit">Add Property</button>

</form>
</div>

<script>

document.getElementById("propertyForm").addEventListener("submit", function(e){

  e.preventDefault();

  // Get values
  let title = document.getElementById("title").value;
  let location = document.getElementById("location").value;
  let price = document.getElementById("price").value;

  // Create card
  let card = document.createElement("div");
  card.classList.add("property-card");

  card.innerHTML = `
      <h3>${title} – ${location}</h3>
      <p>₹${price}</p>
      <button>View Details</button>
  `;

  // Add to properties section
  document.getElementById("properties").appendChild(card);

  // Clear form
  document.getElementById("propertyForm").reset();

});

</script>

</body>
</html>
